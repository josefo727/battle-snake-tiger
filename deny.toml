# Dependency policy for the tiger-engine workspace (constitution Article XIII:
# pinned, minimal, reviewed dependencies). Every choice is explicit; nothing
# relies on a default.

[graph]
all-features = false
no-default-features = false

[advisories]
# Yanked releases and known-vulnerable crates fail the check; there are no
# accepted exceptions. Add an entry to `ignore` only with a written reason.
yanked = "deny"
unmaintained = "workspace"
ignore = []

[licenses]
# Only permissive licenses are accepted for anything that ships in the binary.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "Unicode-3.0",
]
confidence-threshold = 0.8

[licenses.private]
# Workspace and path crates declared `publish = false` have no license to check
# (the sibling rules-core is one; it is this project's own code).
ignore = true

[bans]
# Two versions of one crate are reported, not fatal: the pins are exact and the
# transitive tree is not ours to rewrite.
multiple-versions = "warn"
# A version requirement of `*` would defeat the pinning policy. Path
# dependencies (the reused rules core) carry no version and are exempt.
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = []
skip = []

[sources]
# Everything comes from crates.io except the one path dependency; no git
# sources and no other registries.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
